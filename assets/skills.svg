<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#b44cff"/></linearGradient>
    <clipPath id="c"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Courier New',monospace;font-size:17px;fill:#cfe0ff}
    .p{font-family:'Courier New',monospace;font-size:15px;fill:#00f0ff}
    .b{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 2s ease-out forwards}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1000" height="300" fill="#080b1c"/>
    <text x="30" y="38" class="p">// SKILL_MATRIX.exe</text>
    <g transform="translate(30,85)">
      <text class="t" y="0">NestJS</text><rect x="170" y="-14" width="780" height="14" rx="7" fill="#141b3d"/><rect class="b" x="170" y="-14" width="620" height="14" rx="7" fill="url(#bar)" style="animation-delay:.1s"/>
      <text class="t" y="46">TypeScript</text><rect x="170" y="32" width="780" height="14" rx="7" fill="#141b3d"/><rect class="b" x="170" y="32" width="600" height="14" rx="7" fill="url(#bar)" style="animation-delay:.3s"/>
      <text class="t" y="92">PostgreSQL</text><rect x="170" y="78" width="780" height="14" rx="7" fill="#141b3d"/><rect class="b" x="170" y="78" width="560" height="14" rx="7" fill="url(#bar)" style="animation-delay:.5s"/>
      <text class="t" y="138">TypeORM</text><rect x="170" y="124" width="780" height="14" rx="7" fill="#141b3d"/><rect class="b" x="170" y="124" width="580" height="14" rx="7" fill="url(#bar)" style="animation-delay:.7s"/>
      <text class="t" y="184">JavaScript</text><rect x="170" y="170" width="780" height="14" rx="7" fill="#141b3d"/><rect class="b" x="170" y="170" width="640" height="14" rx="7" fill="url(#bar)" style="animation-delay:.9s"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="#1f2b66" stroke-width="2"/>
</svg>
